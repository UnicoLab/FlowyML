default_language_version:
  python: python3.12

default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.1.11
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      # The built frontend bundle is generated output, and rewriting it is not
      # merely noisy: minified JS contains multi-line template literals where a
      # trailing space is part of the string, so stripping it changes what the
      # program does. Never let the whitespace fixers near it.
      - id: end-of-file-fixer
        exclude: ^flowyml/ui/frontend/dist/
      - id: trailing-whitespace
        exclude: ^flowyml/ui/frontend/dist/
      - id: check-docstring-first
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^flowyml/ui/frontend/dist/
      - id: requirements-txt-fixer
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^flowyml/utils/debug\.py$
      # package-lock.json is written by npm in its own format; reformatting it
      # here just guarantees npm rewrites it back on the next install.
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--indent=2"
        exclude: ^(flowyml/ui/frontend/(dist/|package-lock\.json)|.*\.ipynb)$
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: Commit Message is Valid
        language: pygrep
        entry: ^(break|build|ci|docs|feat|fix|perf|refactor|style|test|ops|hotfix|release|maint|init|enh|revert|reformat)(\([\w.,\-()/]+\))?(!)?:\s.+$
        stages: [commit-msg]
        args: [--negate]
