[tool.poetry]
name = "flowyml"
version = "2.2.1"
description = "Next-Generation ML Pipeline Framework"
authors = ["flowyml Team <support@unicolab.ai>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/UnicoLab/FlowyML"
repository = "https://github.com/UnicoLab/FlowyML"
documentation = "https://unicolab.github.io/FlowyML/latest"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "flowyml"}]
include = ["flowyml/ui/frontend/dist/**/*"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic = ">=2.0.0"
click = ">=8.0.0"
pyyaml = ">=6.0"
numpy = ">=1.20.0"
pandas = ">=1.3.0"
fastapi = ">=0.122.0"
httpx = ">=0.24"
requests = ">=2.28.0"
toml = ">=0.10.2"
loguru = ">=0.7.3"
croniter = ">=2.0.1"
pytz = ">=2024.1"
cloudpickle = ">=2.0.0"
sqlalchemy = ">=2.0.0"
psycopg2-binary = ">=2.9.0"
alembic = ">=1.13.0"
# UI dependencies included by default for better UX
uvicorn = {version = ">=0.23.0", extras = ["standard"]}
websockets = ">=11.0"
python-multipart = ">=0.0.9"
# Rich display for beautiful CLI output (required by CLI and rich-click)
rich = ">=13.0.0"

# Optional dependencies (extras)
torch = {version = ">=2.0.0", optional = true}
tensorflow = {version = ">=2.12.0", optional = true}
keras = {version = ">=3.0", optional = true}
scikit-learn = {version = ">=1.0.0", optional = true}
google-cloud-aiplatform = {version = ">=1.35.0", optional = true}
google-cloud-storage = {version = ">=2.10.0", optional = true}
kfp = {version = ">=2.0", optional = true}
kfp-server-api = {version = ">=2.0.0", optional = true}
boto3 = {version = ">=1.28", optional = true}
sagemaker = {version = ">=2.100", optional = true}
mlflow = {version = ">=2.0", optional = true}
wandb = {version = ">=0.15", optional = true}
azure-ai-ml = {version = ">=1.12.0", optional = true}
azure-identity = {version = ">=1.15.0", optional = true}
azure-storage-blob = {version = ">=12.19.0", optional = true}
langchain-core = {version = ">=0.2.0", optional = true}
langgraph = {version = ">=0.2.0", optional = true}
openai = {version = ">=1.0.0", optional = true}
opentelemetry-api = ">=1.39.1"
opentelemetry-sdk = ">=1.39.1"
opentelemetry-instrumentation-fastapi = ">=0.60b1"
opentelemetry-exporter-prometheus = ">=0.60b1"
psutil = ">=7.2.2"
textual = ">=8.1.1"
rich-click = ">=1.9.7"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
pytest-xdist = ">=3.5"
pytest-mock = ">=3.12"
pre-commit = ">=2.0.0"
ipykernel = ">=7.1.0"

# Type checking
mypy = ">=1.7"
types-pyyaml = ">=6.0"

# Code formatting and linting
black = ">=23.11"
ruff = ">=0.1.0"
isort = ">=5.12"


# Include framework dependencies for testing
tensorflow = ">=2.12.0"
scikit-learn = ">=1.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.6"
mkdocs-material-extensions = ">=1.3.1"
mkdocs-gen-files = ">=0.5.0"
mkdocstrings-python = ">=1.16"
mkdocstrings = {extras = ["python"], version = ">=0.29.0"}
mkdocs-redirects = ">=1.2.2"
mike = ">=2.0.0"
griffe = ">=1.5.0"
mkdocs-include-markdown-plugin = ">=7.2.0"

[tool.poetry.extras]
# IMPORTANT: only list dependencies declared with `optional = true` here.
# Poetry marks any dependency named in an extra as extra-only, so listing a
# *core* dependency (fastapi, uvicorn, websockets, python-multipart, rich)
# would strip it from a plain `pip install flowyml` and break the web UI and
# CLI for every user. `ui` and `rich` are therefore intentionally empty: the
# packages they used to carry are unconditional dependencies now, and the
# empty extras keep `pip install flowyml[ui]` working for existing scripts.
pytorch = ["torch"]
tensorflow = ["tensorflow"]
keras = ["keras"]
sklearn = ["scikit-learn"]
gcp = ["google-cloud-aiplatform", "google-cloud-storage", "kfp", "kfp-server-api"]
aws = ["boto3", "sagemaker"]
azure = ["azure-ai-ml", "azure-identity", "azure-storage-blob"]
mlflow = ["mlflow"]
wandb = ["wandb"]
# UI extra kept for backward compatibility (dependencies are installed by default)
ui = []
# Rich display for beautiful CLI output (installed by default)
rich = []
# GenAI integration extras
langchain = ["langchain-core"]
langgraph = ["langgraph", "langchain-core"]
openai = ["openai"]
genai = ["langgraph", "langchain-core", "openai"]
all = [
    "torch",
    "tensorflow",
    "keras",
    "scikit-learn",
    "google-cloud-aiplatform",
    "google-cloud-storage",
    "kfp",
    "kfp-server-api",
    "boto3",
    "sagemaker",
    "azure-ai-ml",
    "azure-identity",
    "azure-storage-blob",
    "mlflow",
    "wandb",
    # GenAI
    "langgraph",
    "langchain-core",
    "openai",
]

[tool.poetry.scripts]
flowyml = "flowyml.cli.main:cli"
flowy = "flowyml.cli.main:cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["inspiration-only", "flowyml/ui/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Sequential by default; CI/local can add `-n auto --dist=worksteal` for parallelism
addopts = "-v --cov=flowyml --cov-report=term-missing"
# No asyncio_mode here: pytest-asyncio is not a dependency, so the option was
# silently unknown and only produced a PytestConfigWarning on every run. The
# suite's async tests are driven by anyio's pytest plugin via
# `@pytest.mark.anyio`, which works because anyio ships with starlette.
# Markers for test organization
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = [
    "flowyml/__init__.py:__version__",
    "flowyml/ui/frontend/src/components/sidebar/Sidebar.jsx:VERSION",
]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "poetry build"
