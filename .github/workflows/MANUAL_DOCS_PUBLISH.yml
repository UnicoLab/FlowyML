name: "Manual Documentation Publish"

on:
  workflow_dispatch:
    inputs:
      RELEASE_VERSION:
        required: true
        type: string
        description: "Release version for documentation (e.g. 2.1.0)"
      UPDATE_LATEST:
        required: true
        type: boolean
        default: true
        description: "Update the 'latest' alias to point to this version"

permissions:
  contents: write

jobs:
  DEPLOY_DOCS:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --with docs --no-interaction

      - name: Install mike
        run: |
          pip install mike

      - name: Configure git for mike
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || echo "No gh-pages branch exists yet — mike will create it"

      - name: Deploy versioned docs with mike
        id: deploy_docs
        run: |
          VERSION="${{ inputs.RELEASE_VERSION }}"
          echo "Deploying documentation for version ${VERSION}"

          if [[ "${{ inputs.UPDATE_LATEST }}" == "true" ]]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
            echo "✓ Deployed v${VERSION} as 'latest'"
          else
            mike deploy --push "$VERSION"
            echo "✓ Deployed v${VERSION} (latest alias NOT updated)"
          fi
        continue-on-error: true

      - name: Retry docs deployment on failure
        if: steps.deploy_docs.outcome == 'failure'
        run: |
          VERSION="${{ inputs.RELEASE_VERSION }}"
          echo "Retrying documentation deployment..."

          git fetch origin gh-pages:gh-pages --force

          if [[ "${{ inputs.UPDATE_LATEST }}" == "true" ]]; then
            mike deploy --push --update-aliases --force "$VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push --force "$VERSION"
          fi

      - name: List deployed versions
        run: |
          mike list || echo "Could not list versions"
