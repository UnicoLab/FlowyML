name: "Unit-tests"

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "**.py"
      - "pyproject.toml"
      - "tests/**"
      - "flowyml/ui/frontend/**"
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - edited
      - synchronize
    paths:
      - "**.py"
      - "pyproject.toml"
      - "tests/**"
      - "flowyml/ui/frontend/**"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        required: false
        default: "3.11"
      TEST_TYPE:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - frameworks
          - integrations
          - unit

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # Fast smoke test job for quick feedback
  smoke-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # Only the extras the tests actually exercise. An audit of every
          # import in tests/ finds torch, tensorflow, keras and sklearn and
          # nothing else; tensorflow and scikit-learn already come from the dev
          # group, and keras ships with tensorflow, so `pytorch` is the only
          # extra left. --all-extras additionally pulled gcp, aws, azure, kfp,
          # sagemaker, mlflow, wandb and the genai stack - roughly 30 packages
          # and a set of CUDA wheels that no test imports. The extras' own
          # correctness is covered by tests/test_packaging_metadata.py and by
          # the --all-extras install the release workflow still performs.
          poetry install --no-interaction --with dev --extras pytorch
      - name: Run smoke tests
        run: |
          # Run a quick subset of tests for fast feedback
          poetry run pytest tests/test_core.py tests/test_steps.py tests/test_pipeline.py -v --maxfail=3 --tb=short --override-ini="addopts=" || poetry run pytest --co -q | head -20
        timeout-minutes: 3

  # Main test matrix
  test-matrix:
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always() && (needs.smoke-test.result == 'success' || github.event_name != 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        test-group: ["unit", "integration"]

    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # Only the extras the tests actually exercise. An audit of every
          # import in tests/ finds torch, tensorflow, keras and sklearn and
          # nothing else; tensorflow and scikit-learn already come from the dev
          # group, and keras ships with tensorflow, so `pytorch` is the only
          # extra left. --all-extras additionally pulled gcp, aws, azure, kfp,
          # sagemaker, mlflow, wandb and the genai stack - roughly 30 packages
          # and a set of CUDA wheels that no test imports. The extras' own
          # correctness is covered by tests/test_packaging_metadata.py and by
          # the --all-extras install the release workflow still performs.
          poetry install --no-interaction --with dev --extras pytorch

      - name: Run tests - ${{ matrix.test-group }}
        run: |
          case "${{ matrix.test-group }}" in
            "unit")
              poetry run pytest tests/test_*.py tests/enterprise/ tests/core/ -v --maxfail=10 --override-ini="addopts="
              ;;
            "integration")
              poetry run pytest tests/test_*_integration.py tests/enterprise/test_*_integration.py tests/core/test_*_integration.py -v --maxfail=5 --override-ini="addopts="
              ;;
          esac
        timeout-minutes: 15

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}-${{ matrix.test-group }}
          path: |
            pytest.xml
            htmlcov/
          retention-days: 7

  # Frontend unit tests and production build. Nothing previously exercised the
  # UI in CI, so a change that broke the build or a shared helper only surfaced
  # at release time, when the wheel is packaged with a prebuilt bundle.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: flowyml/ui/frontend/package-lock.json

      - name: Install dependencies
        working-directory: flowyml/ui/frontend
        run: npm ci

      - name: Run unit tests
        working-directory: flowyml/ui/frontend
        run: npm test

      - name: Build production bundle
        working-directory: flowyml/ui/frontend
        run: npm run build

  # Coverage job (only on main Python version)
  coverage:
    runs-on: ubuntu-latest
    needs: [test-matrix]
    if: always() && needs.test-matrix.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # Only the extras the tests actually exercise. An audit of every
          # import in tests/ finds torch, tensorflow, keras and sklearn and
          # nothing else; tensorflow and scikit-learn already come from the dev
          # group, and keras ships with tensorflow, so `pytorch` is the only
          # extra left. --all-extras additionally pulled gcp, aws, azure, kfp,
          # sagemaker, mlflow, wandb and the genai stack - roughly 30 packages
          # and a set of CUDA wheels that no test imports. The extras' own
          # correctness is covered by tests/test_packaging_metadata.py and by
          # the --all-extras install the release workflow still performs.
          poetry install --no-interaction --with dev --extras pytorch

      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=flowyml --cov-report=xml --cov-report=html --cov-report=term-missing -v
        timeout-minutes: 20

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
