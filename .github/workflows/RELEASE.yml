name: "Semantic Release"

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        required: false
        default: false
        type: boolean
        description: "Run in dry run mode (no actual release)"
      RELEASE_VERSION:
        required: false
        type: string
        description: "Manually specify release version (only for manual publish/docs jobs)"
      SKIP_RELEASE:
        required: false
        default: false
        type: boolean
        description: "Skip semantic release and use existing version (for recovery)"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. SEMANTIC RELEASE — Bump version, tag, update all version files
  # ─────────────────────────────────────────────────────────────────
  SEMANTIC_RELEASE:
    if: ${{ !inputs.SKIP_RELEASE }}
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
      release_created: ${{ steps.semantic-release.outputs.new_release_published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # GitPython 3.1.60 removed `Actor.name_email_regex`, which
          # python-semantic-release reads unconditionally while loading its
          # configuration. python-semantic-release only asks for
          # `gitpython~=3.0`, so an unpinned install picks the broken one and
          # every release aborts before it does anything:
          #   ::ERROR:: type object 'Actor' has no attribute 'name_email_regex'
          # Cap GitPython below that release rather than pinning
          # python-semantic-release, so this picks up the upstream fix.
          pip install poetry python-semantic-release "gitpython<3.1.60"

      - name: Semantic Release
        id: semantic-release
        run: |
          if [[ "${{ inputs.DRY_RUN }}" == "true" ]]; then
            echo "Running in dry-run mode"
            semantic-release version --print
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          else
            semantic-release version
            if [ $? -eq 0 ]; then
              VERSION=$(semantic-release version --print)
              echo "new_release_published=true" >> $GITHUB_OUTPUT
              echo "new_release_version=$VERSION" >> $GITHUB_OUTPUT
            else
              echo "new_release_published=false" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show release information
        shell: bash
        run: |
          echo "Release created: ${{ steps.semantic-release.outputs.new_release_published }}"
          echo "New version: ${{ steps.semantic-release.outputs.new_release_version }}"

      - name: Sync version across all sources
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: |
          VERSION="${{ steps.semantic-release.outputs.new_release_version }}"
          MAJOR_MINOR=$(echo "$VERSION" | sed 's/\.[0-9]*$//')

          echo "Syncing version $VERSION (display: $MAJOR_MINOR) across all sources..."

          # 1. Save recovery file
          mkdir -p .github/recovery
          echo "$VERSION" > .github/recovery/last_release_version.txt

          # 2. Update docs announcement banner (major.minor display)
          if [ -f "docs/overrides/main.html" ]; then
            sed -i "s/FlowyML v[0-9]*\.[0-9]*/FlowyML v${MAJOR_MINOR}/" docs/overrides/main.html
            echo "✓ Updated docs banner → FlowyML v${MAJOR_MINOR}"
          fi

          # 3. Update UI sidebar version (full semver)
          SIDEBAR="flowyml/ui/frontend/src/components/sidebar/Sidebar.jsx"
          if [ -f "$SIDEBAR" ]; then
            sed -i "s/^const VERSION = \"[0-9]*\.[0-9]*\.[0-9]*\";/const VERSION = \"${VERSION}\";/" "$SIDEBAR"
            echo "✓ Updated UI sidebar → FlowyML v${VERSION}"
          fi

          # 4. Commit and push all version updates
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "maint: sync version to ${VERSION} across all sources [skip ci]" || echo "No changes to commit"
          git push || echo "Failed to push version sync"

  # ─────────────────────────────────────────────────────────────
  # 2. PYPI PUBLISH — Build frontend, package, and publish
  # ─────────────────────────────────────────────────────────────
  PYPI_PUBLISH:
    needs: [SEMANTIC_RELEASE]
    if: ${{ always() && (needs.SEMANTIC_RELEASE.outputs.release_created == 'true' || inputs.SKIP_RELEASE) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Get version to publish
        id: get_version
        run: |
          if [[ "${{ inputs.SKIP_RELEASE }}" == "true" ]]; then
            if [[ -n "${{ inputs.RELEASE_VERSION }}" ]]; then
              echo "Using manually specified version: ${{ inputs.RELEASE_VERSION }}"
              echo "VERSION=${{ inputs.RELEASE_VERSION }}" >> $GITHUB_OUTPUT
            else
              if [[ -f ".github/recovery/last_release_version.txt" ]]; then
                VERSION=$(cat .github/recovery/last_release_version.txt)
                echo "Using recovered version: $VERSION"
                echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
              else
                echo "ERROR: No version specified and no recovery file found"
                exit 1
              fi
            fi
          else
            echo "Using version from semantic-release: ${{ needs.SEMANTIC_RELEASE.outputs.new_release_version }}"
            echo "VERSION=${{ needs.SEMANTIC_RELEASE.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install project dependencies
        run: |
          poetry install --all-extras --no-interaction

      - name: Set version for publishing
        run: |
          echo "Setting package version to ${{ steps.get_version.outputs.VERSION }}"
          poetry version ${{ steps.get_version.outputs.VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd flowyml/ui/frontend
          npm install
          npm run build

      - name: Build and publish to PyPI
        id: publish_pypi
        run: |
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}
          poetry build
          poetry publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        continue-on-error: true

      - name: Retry PyPI publish on failure
        if: steps.publish_pypi.outcome == 'failure'
        run: |
          echo "First attempt failed, retrying..."
          sleep 10
          rm -rf dist
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}
          poetry build
          poetry publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}

  # ────────────────────────────────────────────────────────────────────
  # 3. DEPLOY DOCS — Build with MkDocs + deploy versioned docs via Mike
  # ────────────────────────────────────────────────────────────────────
  DEPLOY_DOCS:
    needs: [SEMANTIC_RELEASE, PYPI_PUBLISH]
    if: ${{ always() && ((needs.SEMANTIC_RELEASE.outputs.release_created == 'true' && needs.PYPI_PUBLISH.result != 'failure') || inputs.SKIP_RELEASE) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get version for docs
        id: get_docs_version
        run: |
          if [[ "${{ inputs.SKIP_RELEASE }}" == "true" ]]; then
            if [[ -n "${{ inputs.RELEASE_VERSION }}" ]]; then
              echo "Using manually specified version: ${{ inputs.RELEASE_VERSION }}"
              echo "VERSION=${{ inputs.RELEASE_VERSION }}" >> $GITHUB_OUTPUT
            else
              if [[ -f ".github/recovery/last_release_version.txt" ]]; then
                VERSION=$(cat .github/recovery/last_release_version.txt)
                echo "Using recovered version: $VERSION"
                echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
              else
                echo "ERROR: No version specified and no recovery file found"
                exit 1
              fi
            fi
          else
            echo "Using version from semantic-release: ${{ needs.SEMANTIC_RELEASE.outputs.new_release_version }}"
            echo "VERSION=${{ needs.SEMANTIC_RELEASE.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --with docs --no-interaction

      - name: Install mike
        run: |
          pip install mike

      - name: Configure git for mike
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || echo "No gh-pages branch exists yet — mike will create it"

      - name: Deploy versioned docs with mike
        id: deploy_docs
        run: |
          VERSION="${{ steps.get_docs_version.outputs.VERSION }}"
          echo "Deploying documentation for version $VERSION"

          # Deploy this version and set it as 'latest'
          mike deploy --push --update-aliases "$VERSION" latest

          # Set the default version to 'latest' so root URL redirects properly
          mike set-default --push latest

          echo "✓ Deployed docs v${VERSION} (aliased as 'latest')"
          echo "  → https://unicolab.github.io/FlowyML/latest/"
          echo "  → https://unicolab.github.io/FlowyML/${VERSION}/"
        continue-on-error: true

      - name: Retry docs deployment on failure
        if: steps.deploy_docs.outcome == 'failure'
        run: |
          VERSION="${{ steps.get_docs_version.outputs.VERSION }}"
          echo "First documentation deploy attempt failed, retrying..."

          # Force-fetch the latest gh-pages branch
          git fetch origin gh-pages:gh-pages --force

          # Force deploy
          mike deploy --push --update-aliases --force "$VERSION" latest
          mike set-default --push latest
